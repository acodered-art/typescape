services:
  db:
    image: postgres:16-alpine
    container_name: typescape-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: typescape
      POSTGRES_PASSWORD: typescape
      POSTGRES_DB: typescape
    ports:
      - "5434:5432"
    volumes:
      - /Media/typescape/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typescape"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: typescape-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - /Media/typescape/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: typescape-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: typescape-meili-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7710:7700"
    volumes:
      - /Media/typescape/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5